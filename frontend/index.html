<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ML Papers — Daily arXiv Feed</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@400;700;800&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg:       #0c0c0c;
      --surface:  #141414;
      --border:   #242424;
      --muted:    #444;
      --text:     #e8e8e8;
      --dim:      #888;
      --accent:   #c8ff00;
      --red:      #ff4444;
      --blue:     #4af;

      --task-classification: #c8ff00;
      --task-generation:     #ff9f40;
      --task-reasoning:      #4af;
      --task-optimization:   #c084fc;
      --task-representation: #fb7185;
      --task-other:          #888;

      --diff-beginner:     #4ade80;
      --diff-intermediate: #facc15;
      --diff-advanced:     #f87171;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { scroll-behavior: smooth; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 2rem 2.5rem 1.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 2rem;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 100;
    }

    .header-left h1 {
      font-size: clamp(1.6rem, 4vw, 2.4rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .header-left h1 em {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      color: var(--accent);
    }

    .header-left p {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--dim);
      margin-top: 0.4rem;
      letter-spacing: 0.05em;
    }

    #stats-bar {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--dim);
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    #stats-bar span b {
      color: var(--accent);
      font-weight: 500;
    }

    /* ── Controls ── */
    .controls {
      padding: 1rem 2.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 0.75rem;
      flex-wrap: wrap;
      align-items: center;
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative;
    }

    .search-wrap input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem 0.5rem 2rem;
      outline: none;
      transition: border-color 0.15s;
    }

    .search-wrap input:focus { border-color: var(--accent); }

    .search-wrap::before {
      content: '⌕';
      position: absolute;
      left: 0.6rem;
      top: 50%;
      transform: translateY(-50%);
      color: var(--muted);
      font-size: 1rem;
      pointer-events: none;
    }

    .filter-group {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
    }

    .chip {
      font-family: 'DM Mono', monospace;
      font-size: 0.68rem;
      letter-spacing: 0.04em;
      padding: 0.35rem 0.7rem;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--dim);
      cursor: pointer;
      transition: all 0.12s;
      text-transform: uppercase;
    }

    .chip:hover { border-color: var(--muted); color: var(--text); }

    .chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
    }

    /* ── Layout ── */
    main {
      display: grid;
      grid-template-columns: 220px 1fr;
      min-height: calc(100vh - 140px);
    }

    /* ── Sidebar ── */
    aside {
      border-right: 1px solid var(--border);
      padding: 1.5rem 1.25rem;
      position: sticky;
      top: 100px;
      height: fit-content;
    }

    .sidebar-section {
      margin-bottom: 2rem;
    }

    .sidebar-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.75rem;
    }

    .task-bar {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .task-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
    }

    .task-row:hover .task-name { color: var(--text); }

    .ad-box {
      border: 1px solid var(--border);
      padding: 1rem;
      border-radius: 0.75rem;
      background: rgba(255,255,255,0.02);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      line-height: 1.4;
      min-height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .ad-fallback {
      opacity: 0.8;
      max-width: 100%;
    }

    .tag-velocity {
      background: rgba(200, 255, 0, 0.12);
      color: var(--accent);
      border-color: rgba(200, 255, 0, 0.35);
    }

    .task-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .task-name {
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      color: var(--dim);
      flex: 1;
      transition: color 0.1s;
    }

    .task-count {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      color: var(--muted);
    }

    /* date sparkline */
    #sparkline {
      width: 100%;
      height: 40px;
    }

    /* ── Paper grid ── */
    #paper-list {
      padding: 1.5rem 2rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 1px;
      background: var(--border);
      align-content: start;
    }

    .paper-card {
      background: var(--bg);
      padding: 1.25rem 1.4rem;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
      cursor: pointer;
      transition: background 0.12s;
      animation: fadeIn 0.25s ease both;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .paper-card:hover { background: var(--surface); }

    .card-meta {
      display: flex;
      gap: 0.5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      letter-spacing: 0.05em;
      padding: 0.2rem 0.45rem;
      text-transform: uppercase;
    }

    .tag-task {
      background: color-mix(in srgb, var(--task-color) 15%, transparent);
      color: var(--task-color);
      border: 1px solid color-mix(in srgb, var(--task-color) 30%, transparent);
    }

    .tag-diff {
      background: transparent;
      color: var(--diff-color);
      border: 1px solid color-mix(in srgb, var(--diff-color) 30%, transparent);
    }

    .tag-date {
      margin-left: auto;
      color: var(--muted);
      border: none;
      font-size: 0.62rem;
    }

    .card-title {
      font-size: 0.92rem;
      font-weight: 700;
      line-height: 1.35;
      letter-spacing: -0.01em;
    }

    .card-tldr {
      font-family: 'Instrument Serif', serif;
      font-style: italic;
      font-size: 0.9rem;
      color: var(--dim);
      line-height: 1.4;
    }

    .card-methods {
      display: flex;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .method-tag {
      font-family: 'DM Mono', monospace;
      font-size: 0.6rem;
      color: var(--muted);
      background: var(--surface);
      padding: 0.15rem 0.4rem;
    }

    .card-authors {
      font-family: 'DM Mono', monospace;
      font-size: 0.62rem;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* ── Modal ── */
    #modal-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 200;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    #modal-overlay.open { display: flex; }

    #modal {
      background: var(--surface);
      border: 1px solid var(--border);
      max-width: 680px;
      width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      padding: 2rem;
      position: relative;
      animation: modalIn 0.2s ease;
    }

    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.97); }
      to   { opacity: 1; transform: scale(1); }
    }

    #modal-close {
      position: absolute;
      top: 1rem;
      right: 1rem;
      background: none;
      border: none;
      color: var(--dim);
      font-size: 1.2rem;
      cursor: pointer;
      font-family: 'DM Mono', monospace;
      transition: color 0.1s;
    }

    #modal-close:hover { color: var(--text); }

    #modal h2 {
      font-size: 1.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.4;
      margin-bottom: 1rem;
      padding-right: 2rem;
    }

    #modal .modal-section {
      margin-bottom: 1.2rem;
    }

    #modal .modal-label {
      font-family: 'DM Mono', monospace;
      font-size: 0.65rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    #modal .modal-body {
      font-size: 0.88rem;
      line-height: 1.65;
      color: var(--dim);
    }

    #modal .modal-abstract {
      font-size: 0.82rem;
      line-height: 1.7;
      color: var(--muted);
    }

    #modal a {
      font-family: 'DM Mono', monospace;
      font-size: 0.75rem;
      color: var(--accent);
      text-decoration: none;
      border-bottom: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
      padding-bottom: 1px;
      transition: border-color 0.1s;
    }

    #modal a:hover { border-color: var(--accent); }

    /* ── Empty / loading ── */
    .state-msg {
      grid-column: 1 / -1;
      padding: 4rem 2rem;
      text-align: center;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      color: var(--muted);
    }

    .loader {
      display: inline-block;
      width: 10px;
      height: 10px;
      background: var(--accent);
      animation: blink 0.8s steps(1) infinite;
      vertical-align: middle;
      margin-right: 0.5rem;
    }

    @keyframes blink { 50% { opacity: 0; } }

    /* ── Load more ── */
    #load-more {
      grid-column: 1 / -1;
      background: none;
      border: 1px solid var(--border);
      color: var(--dim);
      font-family: 'DM Mono', monospace;
      font-size: 0.72rem;
      padding: 0.75rem;
      cursor: pointer;
      transition: all 0.12s;
      margin: 1rem 0;
      letter-spacing: 0.05em;
    }

    #load-more:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 700px) {
      main { grid-template-columns: 1fr; }
      aside { position: static; border-right: none; border-bottom: 1px solid var(--border); }
      header { padding: 1.2rem 1rem; }
      .controls { padding: 0.75rem 1rem; }
      #paper-list { padding: 0; }
    }
  </style>
</head>
<body>

<header>
  <div class="header-left">
    <h1>ML <em>Papers</em></h1>
    <p id="last-updated">Loading...</p>
  </div>
  <div id="stats-bar">
    <span><b id="stat-total">–</b> papers</span>
  </div>
</header>

<div class="controls">
  <div class="search-wrap">
    <input type="text" id="search-input" placeholder="search titles, summaries..." />
  </div>

  <div class="filter-group" id="task-chips">
    <button class="chip active" data-task="">All</button>
    <button class="chip" data-task="classification">Classification</button>
    <button class="chip" data-task="generation">Generation</button>
    <button class="chip" data-task="reasoning">Reasoning</button>
    <button class="chip" data-task="optimization">Optimization</button>
    <button class="chip" data-task="representation">Representation</button>
    <button class="chip" data-task="other">Other</button>
  </div>

  <div class="filter-group" id="diff-chips">
    <button class="chip active" data-diff="">All levels</button>
    <button class="chip" data-diff="beginner">Beginner</button>
    <button class="chip" data-diff="intermediate">Intermediate</button>
    <button class="chip" data-diff="advanced">Advanced</button>
  </div>
</div>

<main>
  <aside>
    <div class="sidebar-section">
      <div class="sidebar-label">By Task</div>
      <div class="task-bar" id="task-bar"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Trending</div>
      <div id="trending-list"></div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Sponsored</div>
      <div class="ad-box">
        <div class="ad-fallback">
          <strong>Ad slot preview</strong><br />
          Replace `data-ad-client` and `data-ad-slot` with your real AdSense values.
          Ads often do not render on localhost or before your site is approved.
        </div>
        <ins class="adsbygoogle"
             style="display:block"
             data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
             data-ad-slot="1234567890"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
      </div>
    </div>
    <div class="sidebar-section">
      <div class="sidebar-label">Last 14 Days</div>
      <svg id="sparkline" viewBox="0 0 180 40" preserveAspectRatio="none"></svg>
    </div>
  </aside>

  <div id="paper-list">
    <div class="state-msg"><span class="loader"></span> Fetching papers...</div>
  </div>
</main>

<!-- Modal -->
<div id="modal-overlay">
  <div id="modal">
    <button id="modal-close">✕</button>
    <h2 id="modal-title"></h2>
    <div class="modal-section">
      <div class="modal-label">Summary</div>
      <div class="modal-body" id="modal-summary"></div>
    </div>
    <div class="modal-section">
      <div class="modal-label">Abstract</div>
      <div class="modal-body modal-abstract" id="modal-abstract"></div>
    </div>
    <div class="modal-section">
      <div class="modal-label">Authors</div>
      <div class="modal-body" id="modal-authors"></div>
    </div>
    <div class="modal-section">
      <a id="modal-link" href="#" target="_blank" rel="noopener">View on arXiv →</a>
    </div>
  </div>
</div>

<script>
const API = window.location.host === 'localhost:3000' ? 'http://localhost:8000' : '';

const TASK_COLORS = {
  classification: 'var(--task-classification)',
  generation:     'var(--task-generation)',
  reasoning:      'var(--task-reasoning)',
  optimization:   'var(--task-optimization)',
  representation: 'var(--task-representation)',
  other:          'var(--task-other)',
};

const DIFF_COLORS = {
  beginner:     'var(--diff-beginner)',
  intermediate: 'var(--diff-intermediate)',
  advanced:     'var(--diff-advanced)',
};

let state = {
  task:   '',
  diff:   '',
  search: '',
  offset: 0,
  papers: [],
  done:   false,
};

// ── Fetch ─────────────────────────────────────────────────────────────────────

async function fetchPapers(reset = false) {
  if (reset) { state.offset = 0; state.papers = []; state.done = false; }
  if (state.done) return;

  const params = new URLSearchParams({ limit: 50, offset: state.offset });
  if (state.task)   params.set('task', state.task);
  if (state.diff)   params.set('difficulty', state.diff);
  if (state.search) params.set('search', state.search);

  const res  = await fetch(`${API}/api/papers?${params}`);
  const data = await res.json();

  state.papers  = reset ? data : [...state.papers, ...data];
  state.offset += data.length;
  if (data.length < 50) state.done = true;

  renderPapers();
}

async function fetchStats() {
  const res  = await fetch(`${API}/api/stats`);
  const data = await res.json();

  document.getElementById('stat-total').textContent = data.total.toLocaleString();
  document.getElementById('last-updated').textContent =
    `UPDATED ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }).toUpperCase()}`;

  renderTaskBar(data.by_task);
  renderTrending(data.trending);
  renderSparkline(data.by_date);
}

// ── Render ────────────────────────────────────────────────────────────────────

function renderPapers() {
  const list = document.getElementById('paper-list');
  list.innerHTML = '';

  if (!state.papers.length) {
    list.innerHTML = '<div class="state-msg">No papers match this filter.</div>';
    return;
  }

  state.papers.forEach((p, i) => {
    const card = document.createElement('div');
    card.className = 'paper-card';
    card.style.animationDelay = `${Math.min(i % 50, 20) * 20}ms`;

    const taskColor = TASK_COLORS[p.task] || TASK_COLORS.other;
    const diffColor = DIFF_COLORS[p.difficulty] || 'var(--muted)';
    const methods   = (p.methods || []).slice(0, 4)
      .map(m => `<span class="method-tag">${m}</span>`).join('');
    const authors   = p.authors.slice(0, 3).join(', ') + (p.authors.length > 3 ? ' et al.' : '');

    card.innerHTML = `
      <div class="card-meta">
        <span class="tag tag-task" style="--task-color:${taskColor}">${p.task || 'other'}</span>
        <span class="tag tag-diff" style="--diff-color:${diffColor}">${p.difficulty || ''}</span>
        ${p.velocity ? `<span class="tag tag-velocity">${Math.round(p.velocity * 100)}% hot</span>` : ''}
        <span class="tag tag-date">${p.published}</span>
      </div>
      <div class="card-title">${escHtml(p.title)}</div>
      ${p.tldr ? `<div class="card-tldr">${escHtml(p.tldr)}</div>` : ''}
      ${methods ? `<div class="card-methods">${methods}</div>` : ''}
      <div class="card-authors">${escHtml(authors)}</div>
    `;

    card.addEventListener('click', () => openModal(p));
    list.appendChild(card);
  });

  if (!state.done) {
    const btn = document.createElement('button');
    btn.id = 'load-more';
    btn.textContent = 'Load more';
    btn.addEventListener('click', () => fetchPapers(false));
    list.appendChild(btn);
  }
}

function renderTaskBar(byTask) {
  const bar = document.getElementById('task-bar');
  bar.innerHTML = '';
  byTask.forEach(({ task, n }) => {
    const color = TASK_COLORS[task] || TASK_COLORS.other;
    const row = document.createElement('div');
    row.className = 'task-row';
    row.innerHTML = `
      <span class="task-dot" style="background:${color}"></span>
      <span class="task-name">${task || 'other'}</span>
      <span class="task-count">${n}</span>
    `;
    row.addEventListener('click', () => {
      setTaskFilter(task);
    });
    bar.appendChild(row);
  });
}

function renderTrending(trending) {
  const container = document.getElementById('trending-list');
  if (!container) return;
  if (!trending?.length) {
    container.innerHTML = '<div class="state-msg">No trending papers available.</div>';
    return;
  }

  container.innerHTML = trending
    .map((paper) => {
      const score = paper.velocity ? `${Math.round(paper.velocity * 100)}%` : '—';
      return `
        <div class="task-row">
          <span class="task-name">${escHtml(paper.title)}</span>
          <span class="task-count">${score}</span>
        </div>
      `;
    })
    .join('');
}

function renderSparkline(byDate) {
  const svg = document.getElementById('sparkline');
  if (!byDate.length) return;

  const sorted = [...byDate].sort((a, b) => a.published.localeCompare(b.published));
  const counts = sorted.map(d => d.n);
  const max    = Math.max(...counts, 1);
  const W = 180, H = 40, pad = 4;
  const step = (W - pad * 2) / (counts.length - 1 || 1);

  const pts = counts.map((c, i) => {
    const x = pad + i * step;
    const y = H - pad - ((c / max) * (H - pad * 2));
    return `${x},${y}`;
  });

  svg.innerHTML = `
    <polyline
      points="${pts.join(' ')}"
      fill="none"
      stroke="var(--accent)"
      stroke-width="1.5"
      stroke-linejoin="round"
      stroke-linecap="round"
    />
    ${counts.map((c, i) => {
      const [x, y] = pts[i].split(',');
      return `<circle cx="${x}" cy="${y}" r="2" fill="var(--accent)" />`;
    }).join('')}
  `;
}

// ── Modal ─────────────────────────────────────────────────────────────────────

function openModal(p) {
  document.getElementById('modal-title').textContent   = p.title;
  document.getElementById('modal-summary').textContent = p.summary || '—';
  document.getElementById('modal-abstract').textContent = p.abstract;
  document.getElementById('modal-authors').textContent  = p.authors.join(', ');
  document.getElementById('modal-link').href = p.id;

  document.getElementById('modal-overlay').classList.add('open');
}

document.getElementById('modal-close').addEventListener('click', closeModal);
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modal-overlay')) closeModal();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('open');
}

// ── Filters ───────────────────────────────────────────────────────────────────

function setTaskFilter(task) {
  state.task = task;
  document.querySelectorAll('#task-chips .chip').forEach(c => {
    c.classList.toggle('active', c.dataset.task === task);
  });
  fetchPapers(true);
}

document.querySelectorAll('#task-chips .chip').forEach(btn => {
  btn.addEventListener('click', () => setTaskFilter(btn.dataset.task));
});

document.querySelectorAll('#diff-chips .chip').forEach(btn => {
  btn.addEventListener('click', () => {
    state.diff = btn.dataset.diff;
    document.querySelectorAll('#diff-chips .chip').forEach(c =>
      c.classList.toggle('active', c.dataset.diff === btn.dataset.diff)
    );
    fetchPapers(true);
  });
});

let searchTimer;
document.getElementById('search-input').addEventListener('input', e => {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    state.search = e.target.value.trim();
    fetchPapers(true);
  }, 350);
});

// ── Util ──────────────────────────────────────────────────────────────────────

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

// ── Init ──────────────────────────────────────────────────────────────────────

fetchStats();
fetchPapers(true);
