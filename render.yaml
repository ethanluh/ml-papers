services:
  - type: web
    name: arxiv-ml-dashboard
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data
    disk:
      name: sqlite-storage
      mountPath: /var/data
      sizeGB: 1

  - type: worker
    name: arxiv-scheduler
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python pipeline/scheduler.py
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_PATH
        value: /var/data
